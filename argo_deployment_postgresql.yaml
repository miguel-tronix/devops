# Refined Helm-based PostgreSQL Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    targetRevision: 18.1.9
    chart: postgresql
    helm:
      values: |
        auth:
          database: "app_db"
          username: "app_user"
          existingSecret: "postgresql-secret"
        primary:
          persistence:
            size: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true