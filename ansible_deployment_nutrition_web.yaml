---
- name: Deploy Nutrition Web to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # General settings
    app_name: "nutrition-web"
    k8s_namespace: "nutrition-web"
    resource_state: "present"

    # Deployment settings
    app_image: "localhost:32000/nutrition-web:latest"
    app_replicas: 2
    container_port: 8080

    # Database settings
    db_host: "postgresql-vector.database.svc.cluster.local"
    db_port: 5432
    db_name: "nutrition_db"
    db_user: "nutrition"
    # Placeholder for the actual password
    db_password: "CHANGE_ME"

    # Ingress settings
    ingress_host: "nutrition.k8s.local"
    ingress_class_name: "nginx"

  tasks:
    - name: "Ensure Namespace '{{ k8s_namespace }}' is {{ resource_state }}"
      kubernetes.core.k8s:
        name: "{{ k8s_namespace }}"
        api_version: v1
        kind: Namespace
        state: "{{ resource_state }}"

    - name: "Ensure Nutrition Web ConfigMap is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ app_name }}-config"
            namespace: "{{ k8s_namespace }}"
          data:
            DB_HOST: "{{ db_host }}"
            DB_PORT: "{{ db_port | string }}"
            DB_NAME: "{{ db_name }}"
            DB_USER: "{{ db_user }}"

    - name: "Ensure Nutrition Web Secret is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ app_name }}-secret"
            namespace: "{{ k8s_namespace }}"
          type: Opaque
          stringData:
            DB_PASSWORD: "{{ db_password }}"

    - name: "Ensure Nutrition Web Deployment is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ k8s_namespace }}"
            labels:
              app: "{{ app_name }}"
          spec:
            replicas: "{{ app_replicas }}"
            selector:
              matchLabels:
                app: "{{ app_name }}"
            template:
              metadata:
                labels:
                  app: "{{ app_name }}"
              spec:
                containers:
                  - name: "{{ app_name }}"
                    image: "{{ app_image }}"
                    ports:
                      - containerPort: "{{ container_port }}"
                        name: http
                    envFrom:
                      - configMapRef:
                          name: "{{ app_name }}-config"
                      - secretRef:
                          name: "{{ app_name }}-secret"
                    readinessProbe:
                      httpGet:
                        path: /NutritionWeb/
                        port: "{{ container_port }}"
                      initialDelaySeconds: 60
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /NutritionWeb/
                        port: "{{ container_port }}"
                      initialDelaySeconds: 90
                      periodSeconds: 15

    - name: "Ensure Nutrition Web Service is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ k8s_namespace }}"
          spec:
            selector:
              app: "{{ app_name }}"
            ports:
              - protocol: TCP
                port: 80
                targetPort: "{{ container_port }}"
            type: ClusterIP

    - name: "Ensure Nutrition Web Ingress is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ k8s_namespace }}"
            annotations:
              kubernetes.io/ingress.class: "{{ ingress_class_name }}"
              nginx.ingress.kubernetes.io/proxy-body-size: "50m"
          spec:
            ingressClassName: "{{ ingress_class_name }}"
            rules:
              - host: "{{ ingress_host }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: "{{ app_name }}"
                          port:
                            number: 80
