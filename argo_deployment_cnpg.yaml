apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-pgvector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/miguel-tronix/devops.git
    targetRevision: dev
    path: k8s/postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
