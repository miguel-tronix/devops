apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-pgvector
  namespace: database
spec:
  description: "PostgreSQL cluster with pgvector extension"

  imageName: ghcr.io/cloudnative-pg/postgresql:16
  enableSuperuserAccess: true

  instances: 1

  enablePDB: true

  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
    synchronizeReplicas:
      enabled: true
    updateInterval: 30

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart
  switchoverDelay: 3600
  failoverDelay: 0
  startDelay: 3600
  stopDelay: 1800
  maxSyncReplicas: 0
  minSyncReplicas: 0
  smartShutdownTimeout: 180

  logLevel: info

  affinity:
    podAntiAffinityType: preferred

  postgresUID: 26
  postgresGID: 26

  storage:
    size: 30Gi
    storageClass: local-ssd

  postgresql:
    parameters:
      shared_buffers: "256MB"
      max_connections: "200"
      log_statement: "all"
      log_min_duration_statement: "1000"
    pg_hba:
      - host all all 0.0.0.0/0 md5

  bootstrap:
    initdb:
      database: appdb
      owner: appuser
      secret:
        name: app-user-secret
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS "pgcrypto";

  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: "s3://your-backup-bucket/"
      endpointURL: "https://s3.amazonaws.com"
      s3Credentials:
        accessKeyId:
          name: backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backup-credentials
          key: ACCESS_SECRET_KEY

  monitoring:
    enablePodMonitor: false

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
