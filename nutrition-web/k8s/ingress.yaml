apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nutrition-web
  namespace: nutrition-web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: nutrition.k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nutrition-web
                port:
                  number: 80
