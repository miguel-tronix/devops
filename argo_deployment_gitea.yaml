apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 10.6.0
    helm:
      values: |
        gitea:
          admin:
            existingSecret: gitea-admin-secret
          # Use env vars to override ALL config — prevents chart defaults (e.g. localhost redis) from winning
          additionalConfigFromEnvs:
            - name: GITEA__database__DB_TYPE
              value: "postgres"
            - name: GITEA__database__HOST
              value: "postgresql-pgvector-rw.database.svc.cluster.local:5432"
            - name: GITEA__database__NAME
              value: "appdb"
            - name: GITEA__database__USER
              value: "appuser"
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-db-secret
                  key: DB_PASSWD
            - name: GITEA__cache__ADAPTER
              value: "redis"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-redis-secret
                  key: redis-password
            - name: GITEA__cache__HOST
              value: "redis://:$(REDIS_PASSWORD)@redis-cluster-master.cache.svc.cluster.local:6379/0?pool_size=100"
            - name: GITEA__session__PROVIDER
              value: "redis"
            - name: GITEA__session__PROVIDER_CONFIG
              value: "network=tcp,addr=redis-cluster-master.cache.svc.cluster.local:6379,password=$(REDIS_PASSWORD),pool_size=100,db=0"

        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: code.k8s.local
              paths:
                - path: /
                  pathType: Prefix
          annotations:
            kubernetes.io/ingress.class: nginx
            nginx.ingress.kubernetes.io/ssl-redirect: "false"

        # Fully disable internal components
        postgresql:
          enabled: false
        postgresql-ha:
          enabled: false
        redis-cluster:
          enabled: false
        redis:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: code
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
