---
- name: Deploy Django Customer Configurator to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # General settings
    app_name: "cc-backend"
    k8s_namespace: "qcc-backend"
    resource_state: "present" # Use "absent" to remove all resources

    # Deployment settings
    app_image: "localhost:32000/microservices/cc-backend:latest"
    app_replicas: 1
    container_port: 8080

    # PVC settings (optional)
    pvc_name: "{{ app_name }}-pvc"
    pvc_size: "5Gi"
    pvc_mount_path: "/app/media"

    # Django secret (local file will be base64-encoded into a k8s secret)
    django_secret_name: "{{ app_name }}-secret"
    django_secret_local_path: "{{ lookup('env', 'HOME') }}/.config/gcloud/application_default_credentials.json"
    django_database: "postgres://{{db_user}}:{{db_password}}@{{db_host}}:{{db_port}}/cc_db"

    # GCP Credentials Secret settings
    gcp_secret_name: "{{ app_name }}-gcp-creds"
    gcp_creds_local_path: "{{ lookup('env', 'HOME') }}/.config/gcloud/application_default_credentials.json"
    gcp_creds_container_path: "/root/.config/gcloud/application_default_credentials.json"

    # Service and Ingress settings
    service_port: 80
    ingress_host: "microservices.cc.local"
    ingress_class_name: "nginx"

  tasks:
    - name: "Ensure Namespace '{{ k8s_namespace }}' is {{ resource_state }}"
      kubernetes.core.k8s:
        name: "{{ k8s_namespace }}"
        api_version: v1
        kind: Namespace
        state: present

    - name: "Ensure PersistentVolumeClaim '{{ pvc_name }}' is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ pvc_name }}"
            namespace: "{{ k8s_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: "{{ pvc_size }}"

    - name: "Ensure Django secret '{{ django_secret_name }}' is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ django_secret_name }}"
            namespace: "{{ k8s_namespace }}"
          type: Opaque
          data:
            SECRET_KEY: "{{ lookup('file', django_secret_local_path) | b64encode }}"

    - name: "Ensure GCP credentials secret '{{ gcp_secret_name }}' is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ gcp_secret_name }}"
            namespace: "{{ k8s_namespace }}"
          type: Opaque
          data:
            # The key here must match the final filename in the container
            application_default_credentials.json: "{{ lookup('file', gcp_creds_local_path) | b64encode }}"

    - name: "Ensure Deployment '{{ app_name }}' is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ k8s_namespace }}"
            labels:
              app: "{{ app_name }}"
          spec:
            replicas: "{{ app_replicas }}"
            selector:
              matchLabels:
                app: "{{ app_name }}"
            template:
              metadata:
                labels:
                  app: "{{ app_name }}"
              spec:
                containers:
                  - name: "{{ app_name }}"
                    image: "{{ app_image }}"
                    ports:
                      - containerPort: "{{ container_port }}"
                    env:
                      - name: DATABASE_URL
                        value: "{{ django_database }}"
                      - name: SECRET_KEY
                        valueFrom:
                          secretKeyRef:
                            name: "{{ django_secret_name }}"
                            key: SECRET_KEY
                      - name: DJANGO_ALLOWED_HOSTS
                        value: "{{ ingress_host }}"
                      - name: REDIS_URL
                        value: "redis://redis.redis.svc.cluster.local:6379/0"
                    volumeMounts:
                      - name: "{{ pvc_name }}"
                        mountPath: "{{ pvc_mount_path }}"
                      - name: gcp-creds-volume
                        mountPath: "{{ gcp_creds_container_path }}"
                        subPath: "application_default_credentials.json" # Mount the file, not the directory
                        readOnly: true
                volumes:
                  - name: "{{ pvc_name }}"
                    persistentVolumeClaim:
                      claimName: "{{ pvc_name }}"
                  - name: gcp-creds-volume
                    secret:
                      secretName: "{{ gcp_secret_name }}"

    - name: "Ensure Service '{{ app_name }}' is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ k8s_namespace }}"
          spec:
            selector:
              app: "{{ app_name }}"
            ports:
              - protocol: TCP
                port: "{{ service_port }}"
                targetPort: "{{ container_port }}"
            type: ClusterIP

    - name: "Ensure Ingress for '{{ ingress_host }}' is {{ resource_state }}"
      kubernetes.core.k8s:
        state: "{{ resource_state }}"
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: "{{ app_name }}-ingress"
            namespace: "{{ k8s_namespace }}"
            annotations:
              kubernetes.io/ingress.class: "{{ ingress_class_name }}"
          spec:
            ingressClassName: "{{ ingress_class_name }}"
            rules:
              - host: "{{ ingress_host }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: "{{ app_name }}"
                          port:
                            number: "{{ service_port }}"
