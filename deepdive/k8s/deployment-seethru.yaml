apiVersion: apps/v1
kind: Deployment
metadata:
  name: seethru-frontend
  namespace: deepdive
  labels:
    app: seethru
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seethru
  template:
    metadata:
      labels:
        app: seethru
    spec:
      containers:
        - name: seethru
          image: localhost:32000/llm/frontend/seethru:0.0.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: tls-certs
          secret:
            secretName: deepdive-tls-certs
        - name: nginx-config
          configMap:
            name: seethru-nginx
