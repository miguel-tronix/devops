apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seethru-frontend
  namespace: deepdive
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: seethru.k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seethru-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - seethru.k8s.local
      secretName: deepdive-tls-certs