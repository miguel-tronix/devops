apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepdive-api
  namespace: deepdive
  labels:
    app: deepdive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepdive
  template:
    metadata:
      labels:
        app: deepdive
    spec:
      containers:
        - name: deepdive-api
          image: ghcr.io/miguel-tronix/deepdivee:latest # Update this to your image path
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: deepdive-config
            - secretRef:
                name: deepdive-secrets
          readinessProbe:
            httpGet:
              path: /health # Maps to the /health route built into main.py
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
