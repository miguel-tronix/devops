---
- name: Rotate Secrets and Admin Passwords
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    manifest_dir: "{{ playbook_dir }}/k8s"

  tasks:
    - name: Generate password for PostgreSQL Admin (postgres)
      command: openssl rand -base64 15
      register: new_pg_admin_pass
      changed_when: false

    - name: Generate password for PostgreSQL App User (app_user)
      command: openssl rand -base64 15
      register: new_pg_app_pass
      changed_when: false

    - name: Generate password for Redis Admin
      command: openssl rand -base64 15
      register: new_redis_pass
      changed_when: false

    - name: Generate password for Gitea Admin
      command: openssl rand -base64 15
      register: new_gitea_admin_pass
      changed_when: false

    # Update Manifest Files
    - name: Update PostgreSQL secret manifest (postgres-password)
      replace:
        path: "{{ manifest_dir }}/postgresql-secret.yaml"
        regexp: 'postgres-password:\s*".*?"'
        replace: 'postgres-password: "{{ new_pg_admin_pass.stdout }}"'

    - name: Update PostgreSQL secret manifest (password)
      replace:
        path: "{{ manifest_dir }}/postgresql-secret.yaml"
        regexp: 'password:\s*".*?"'
        replace: 'password: "{{ new_pg_app_pass.stdout }}"'
      
    - name: Update Gitea DB secret manifest (DB_PASSWD)
      replace:
        path: "{{ manifest_dir }}/gitea-secrets.yaml"
        regexp: 'DB_PASSWD:\s*".*?"'
        replace: 'DB_PASSWD: "{{ new_pg_app_pass.stdout }}"'

    - name: Update Redis secret manifest
      replace:
        path: "{{ manifest_dir }}/redis-secret.yaml"
        regexp: 'redis-password:\s*".*?"'
        replace: 'redis-password: "{{ new_redis_pass.stdout }}"'

    - name: Update Gitea Redis secret manifest
      replace:
        path: "{{ manifest_dir }}/gitea-redis-secret.yaml"
        regexp: 'redis-password:\s*".*?"'
        replace: 'redis-password: "{{ new_redis_pass.stdout }}"'

    # Apply Manifests
    - name: Apply updated secret manifests to cluster
      command: kubectl apply -f "{{ manifest_dir }}/{{ item }}"
      loop:
        - postgresql-secret.yaml
        - redis-secret.yaml
        - gitea-secrets.yaml
        - gitea-redis-secret.yaml
      register: apply_result
      changed_when: "'configured' in apply_result.stdout"

    # Update actual passwords in running services gracefully
    - name: Update PostgreSQL postgres user password via psql
      command: >
        kubectl exec -n database postgresql-helm-0 --
        psql -U postgres -c "ALTER USER postgres WITH PASSWORD '{{ new_pg_admin_pass.stdout }}';"
      ignore_errors: true
      register: pg_admin_update

    - name: Update PostgreSQL app_user password via psql
      command: >
        kubectl exec -n database postgresql-helm-0 --
        psql -U postgres -c "ALTER USER app_user WITH PASSWORD '{{ new_pg_app_pass.stdout }}';"
      ignore_errors: true

    - name: Update Redis default user password via redis-cli
      # We cannot easily guess the old password automatically to authenticate, so we run config set
      # If Redis allows changes via config rewrite, we can try to apply it. Else rollout restart.
      command: kubectl rollout restart statefulset redis-cluster-master -n cache
      ignore_errors: true

    - name: Update Gitea admin user password inside running pod
      # Assume the user named the initial admin 'admin'. Using sudo -u git inside the gitea container
      command: >
        kubectl exec -n code deploy/gitea -c gitea --
        sudo -u git gitea admin user change-password -u admin -p "{{ new_gitea_admin_pass.stdout }}"
      ignore_errors: true

    - name: Display new generated Gitea admin password
      debug:
        msg: "The newly generated Gitea admin password is: {{ new_gitea_admin_pass.stdout }}"
